<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footballer Routine Intake</title>
  <style>
    :root { color-scheme: light; --bg:#f5f7f2; --panel:#fff; --ink:#172017; --muted:#5b6758; --line:#d7dfd2; --accent:#1f7a4d; --accent-2:#255f85; --warn:#9b5412; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); line-height:1.4; }
    main { max-width:920px; margin:0 auto; padding:20px; }
    header { margin-bottom:14px; }
    h1 { margin:0 0 6px; font-size:26px; }
    p { margin:0 0 10px; color:var(--muted); }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
    .tab { border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 11px; border-radius:6px; cursor:pointer; font-weight:700; }
    .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
    section { display:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:14px; }
    section.active { display:block; }
    h2 { margin:0 0 12px; font-size:19px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
    label { display:grid; gap:6px; font-weight:700; color:var(--ink); font-size:14px; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:9px; font:inherit; color:var(--ink); background:#fff; }
    textarea { min-height:96px; resize:vertical; }
    .hint { font-size:12px; color:var(--muted); font-weight:400; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
    button { border:0; border-radius:6px; padding:10px 13px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
    button.secondary { background:var(--accent-2); }
    button.ghost { background:#e7ece4; color:var(--ink); }
    textarea.output { white-space:pre-wrap; word-break:break-word; background:#101510; color:#eef8ea; padding:14px; border-radius:8px; min-height:220px; overflow:auto; font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.45; }
    .note { color:var(--warn); font-weight:700; }
    .status { min-height:20px; color:var(--muted); font-weight:700; margin-bottom:10px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Footballer Routine Intake</h1>
      <p>Five-minute version. Pick the closest option. The goal is a useful first evaluation, not a perfect file. Metric only.</p>
    </header>

    <nav class="tabs" aria-label="Form sections">
      <button class="tab" type="button" aria-selected="true" data-tab="basics">Basics</button>
      <button class="tab" type="button" aria-selected="false" data-tab="match">Match Week</button>
      <button class="tab" type="button" aria-selected="false" data-tab="load">Load Check</button>
      <button class="tab" type="button" aria-selected="false" data-tab="focus">Output</button>
    </nav>

    <section id="basics" class="active">
      <h2>Basics</h2>
      <div class="grid">
        <label>Language <input id="language" placeholder="English, Spanish, Portuguese..."></label>
        <label>Height cm <input id="height" type="number" min="100" max="230"></label>
        <label>Weight kg <input id="weight" type="number" min="30" max="180" step="0.1"></label>
        <label>Position <input id="position" placeholder="Winger, fullback, midfielder..."></label>
        <label>Format <select id="format"><option value=""></option><option>11-a-side</option><option>8-a-side</option><option>Both</option></select></label>
        <label>Season phase <select id="seasonPhase"><option value=""></option><option>In-season</option><option>Pre-season</option><option>Off-season</option><option>Deload</option><option>Unknown</option></select></label>
        <label>What do you feel you lack right now? <select id="feltGap"><option value=""></option><option>Stamina late in games</option><option>Speed or explosiveness</option><option>Strength/power</option><option>Recovery/fresh legs</option><option>Match-day energy</option><option>Body composition</option><option>Consistency</option><option>Not sure</option></select></label>
      </div>
    </section>

    <section id="match">
      <h2>Match Week</h2>
      <div class="grid">
        <label>Next match <select id="nextMatchTiming"><option value=""></option><option>Today</option><option>Tomorrow</option><option>In 2-3 days</option><option>In 4-7 days</option><option>No match this week</option><option>Unknown</option></select></label>
        <label>Next match day <input id="nextMatchDay" placeholder="Saturday, Sunday..."></label>
        <label>Expected minutes <select id="nextMatchMinutes"><option value=""></option><option>0-30</option><option>31-60</option><option>61-90</option><option>90+</option><option>Unknown</option></select></label>
        <label>Last match <select id="lastMatchTiming"><option value=""></option><option>0-24 hours ago</option><option>24-48 hours ago</option><option>48-72 hours ago</option><option>4+ days ago</option><option>No recent match</option></select></label>
        <label>Last match minutes <select id="lastMatchMinutes"><option value=""></option><option>0-30</option><option>31-60</option><option>61-90</option><option>90+</option><option>Unknown</option></select></label>
        <label>Match importance <select id="matchImportance"><option value=""></option><option>Normal</option><option>High priority</option><option>Cup/tournament</option><option>Friendly</option><option>Unknown</option></select></label>
        <label>Biggest constraint this week <select id="weeklyConstraint"><option value=""></option><option>Too little time</option><option>Heavy legs</option><option>Low sleep</option><option>Travel/long commute</option><option>Missed gym</option><option>Missed team training</option><option>Food/budget issue</option><option>No major constraint</option></select></label>
      </div>
    </section>

    <section id="load">
      <h2>Load Check</h2>
      <div class="grid">
        <label>Team sessions/week <select id="clubSessions"><option value=""></option><option>0</option><option>1</option><option>2</option><option>3</option><option>4+</option></select></label>
        <label>Gym sessions/week <select id="gymSessions"><option value=""></option><option>0</option><option>1</option><option>2</option><option>3+</option></select></label>
        <label>Extra conditioning <select id="conditioningLoad"><option value=""></option><option>None</option><option>Light</option><option>Moderate</option><option>Hard</option></select></label>
        <label>Gym timing near match <select id="gymMatchSpacing"><option value=""></option><option>Heavy gym 3+ days before match</option><option>Heavy gym 2 days before match</option><option>Heavy gym day before match</option><option>Only light/upper near match</option><option>No gym</option><option>Unknown</option></select></label>
        <label>Fatigue <select id="fatigue"><option value=""></option><option>1-3 fresh</option><option>4-6 normal</option><option>7-8 high</option><option>9-10 cooked</option></select></label>
        <label>Soreness/niggles <select id="soreness"><option value=""></option><option>None</option><option>Light</option><option>Moderate</option><option>High</option><option>Sharp pain or recurring issue</option></select></label>
        <label>Sleep <select id="sleep"><option value=""></option><option>Less than 6 h</option><option>6-7 h</option><option>7-8 h</option><option>8+ h</option></select></label>
        <label>Budget/nutrition help <select id="nutritionHelp"><option>Not now</option><option>Basic food timing only</option><option>Match-day eating</option><option>Budget grocery help</option></select></label>
      </div>
      <label>Optional: paste current routine or one-line summary <textarea id="routineNotes" placeholder="Example: team Tue/Thu, gym Wed, match Sat. Heavy legs by Friday."></textarea></label>
    </section>

    <section id="focus">
      <h2>Output</h2>
      <div class="grid">
        <label>Main output <select id="outputFocus"><option>Routine evaluation</option><option>Training adaptation</option><option>Recovery check</option><option>Optional nutrition support</option><option>Multiple outputs</option></select></label>
        <label>Save finished routine? <select id="savePreference"><option>Ask me after the evaluation</option><option>Markdown</option><option>Word-style document</option><option>No file</option></select></label>
      </div>
      <label>Question or goal <textarea id="goal" placeholder="Example: evaluate my in-season week because my legs feel heavy before Saturday matches."></textarea></label>
      <p class="note">This form does not save data automatically. Export Markdown and paste it back in chat.</p>
    </section>

    <div class="actions">
      <button type="button" id="generate">Generate Markdown</button>
      <button type="button" id="copy" class="secondary">Copy Markdown</button>
      <button type="button" id="select" class="ghost">Select Markdown</button>
      <button type="button" id="download" class="ghost">Download Markdown</button>
      <button type="button" id="clear" class="ghost">Clear Form</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
    <textarea id="output" class="output" readonly aria-label="Generated Markdown"></textarea>
  </main>

  <script>
    const fields = ["language","height","weight","position","format","seasonPhase","feltGap","nextMatchTiming","nextMatchDay","nextMatchMinutes","lastMatchTiming","lastMatchMinutes","matchImportance","weeklyConstraint","clubSessions","gymSessions","conditioningLoad","gymMatchSpacing","fatigue","soreness","sleep","nutritionHelp","routineNotes","outputFocus","savePreference","goal"];
    document.querySelectorAll(".tab").forEach((button) => { button.addEventListener("click", () => { document.querySelectorAll(".tab").forEach((tab) => tab.setAttribute("aria-selected", "false")); document.querySelectorAll("section").forEach((section) => section.classList.remove("active")); button.setAttribute("aria-selected", "true"); document.getElementById(button.dataset.tab).classList.add("active"); }); });
    function value(id) { return document.getElementById(id).value.trim(); }
    function line(label, id) { return `- ${label}: ${value(id)}`; }
    function generateMarkdown() {
      const date = new Date().toISOString().slice(0, 10);
      const markdown = `# Footballer Routine Intake

## Profile
${line("Language", "language")}
- Units: metric
${line("Height cm", "height")}
${line("Weight kg", "weight")}
${line("Position", "position")}
${line("Format", "format")}
${line("Season phase", "seasonPhase")}
${line("What the player feels they lack", "feltGap")}

## Match Calendar
${line("Next match timing", "nextMatchTiming")}
${line("Next match day", "nextMatchDay")}
${line("Expected next match minutes", "nextMatchMinutes")}
${line("Last match timing", "lastMatchTiming")}
${line("Last match minutes", "lastMatchMinutes")}
${line("Match importance", "matchImportance")}
${line("Biggest constraint this week", "weeklyConstraint")}

## Current Load
${line("Team sessions/week", "clubSessions")}
${line("Gym sessions/week", "gymSessions")}
${line("Extra conditioning", "conditioningLoad")}
${line("Gym timing near match", "gymMatchSpacing")}
${line("Fatigue", "fatigue")}
${line("Soreness/niggles", "soreness")}
${line("Sleep", "sleep")}
${line("Budget/nutrition help", "nutritionHelp")}

## Routine Notes
${value("routineNotes") || "-"}

## Requested Output
${line("Main output", "outputFocus")}
${line("Save finished routine", "savePreference")}
${line("Question or goal", "goal")}

## Update Date
- ${date}
`;
      document.getElementById("output").value = markdown;
      return markdown;
    }
    function setStatus(message) { document.getElementById("status").textContent = message; }
    function selectMarkdown() { const output = document.getElementById("output"); output.focus(); output.select(); output.setSelectionRange(0, output.value.length); }
    document.getElementById("generate").addEventListener("click", generateMarkdown);
    document.getElementById("copy").addEventListener("click", async () => { const markdown = generateMarkdown(); try { if (!navigator.clipboard || !window.isSecureContext) throw new Error("Clipboard API unavailable"); await navigator.clipboard.writeText(markdown); setStatus("Copied."); } catch (error) { selectMarkdown(); try { document.execCommand("copy"); setStatus("Copied with fallback. If nothing landed in your clipboard, press Ctrl+C now."); } catch (fallbackError) { setStatus("Clipboard is blocked here. The Markdown is selected; press Ctrl+C."); } } });
    document.getElementById("select").addEventListener("click", () => { generateMarkdown(); selectMarkdown(); setStatus("Markdown selected. Press Ctrl+C to copy it."); });
    document.getElementById("download").addEventListener("click", () => { const markdown = generateMarkdown(); const blob = new Blob([markdown], { type: "text/markdown" }); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = "footballer-routine-intake.md"; link.click(); URL.revokeObjectURL(url); setStatus("Download started. If this browser blocks downloads, use Select Markdown."); });
    document.getElementById("clear").addEventListener("click", () => { fields.forEach((id) => { document.getElementById(id).value = ""; }); document.getElementById("nutritionHelp").value = "Not now"; document.getElementById("outputFocus").value = "Routine evaluation"; document.getElementById("savePreference").value = "Ask me after the evaluation"; document.getElementById("output").value = ""; setStatus(""); });
    generateMarkdown();
  </script>
</body>
</html>
